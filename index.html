<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kozak Studio</title>
<meta name="description" content="Kozak Studio — разработка веб-приложений и Telegram мини-приложений">
<meta name="theme-color" content="#EEF1F6">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Manrope:wght@500;600&display=swap">
<style>
/* Layout: вертикальная лента экранов со snap; экран 1 — видео-заставка Omni, замирает на последнем кадре */
:root{
  --pearl:#EEF1F6;
  --ink:#16213A;
  --ink-soft:#4A5470;
  --chip:rgba(255,255,255,.55);
  --chip-edge:rgba(255,255,255,.9);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
:root{
  --top-inset:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --bottom-inset:max(env(safe-area-inset-bottom,0px),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)));
  box-sizing:border-box;height:100%}
body{margin:0;background:var(--pearl);color:var(--ink);font-family:var(--f-body);overflow:hidden}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.screen{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- ЭКРАН 1 ---------- */
.hero{padding:0;background:var(--pearl) url(end.jpg) center/cover no-repeat;cursor:pointer}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;left:0;right:0;bottom:calc(24px + var(--bottom-inset));
  display:flex;flex-direction:column;align-items:center;gap:18px;
  opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease;pointer-events:none}
.hero.done .overlay{opacity:1;transform:none;pointer-events:auto}
.hint{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12px var(--f-body);letter-spacing:.08em;color:var(--ink-soft);
  background:var(--chip);border:1px solid var(--chip-edge);border-radius:999px;padding:8px 18px 10px;cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hint svg{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
.hint:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.skip{position:absolute;top:calc(14px + var(--top-inset));right:max(14px,env(safe-area-inset-right,0px));
  font:600 12px var(--f-body);color:var(--ink-soft);background:var(--chip);border:1px solid var(--chip-edge);border-radius:999px;
  padding:6px 12px;cursor:pointer;transition:opacity .4s}
.hero.done .skip{opacity:0;pointer-events:none}
.tap{position:absolute;left:50%;bottom:calc(36px + var(--bottom-inset));transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;font:600 14px var(--f-body);letter-spacing:.04em;color:var(--ink);
  background:var(--chip);border:1px solid var(--chip-edge);border-radius:999px;padding:12px 24px;cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .5s}
.hero.wait .tap{opacity:1;pointer-events:auto;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.05)}}
.hero.wait .skip,.hero.ready .skip{opacity:0;pointer-events:none}
.hero.playing .skip{opacity:1;pointer-events:auto}
.hero.done .skip,.hero.playing.done .skip{opacity:0;pointer-events:none}
.skip{opacity:0;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- ЭКРАН 2: обложки проектов ---------- */
.works{height:auto;min-height:100%;scroll-snap-align:start;display:flex;flex-direction:column;gap:18px;
  padding-block:calc(var(--top-inset) + 28px) calc(var(--bottom-inset) + 32px);
  background:radial-gradient(110% 50% at 0% 100%,#F8E3D6 0%,transparent 60%),radial-gradient(90% 40% at 100% 0%,#DCE8F7 0%,transparent 60%),var(--pearl)}
.works-head{display:flex;flex-direction:column;gap:6px}
.works-head h2{margin:0;font:800 clamp(24px,7vw,32px)/1.05 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lang{flex:none;display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(30,45,80,.08)}
.lang button{font:700 12px var(--f-body);letter-spacing:.06em;color:var(--ink-soft);background:none;border:0;border-radius:999px;padding:6px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.works-head p{margin:0;font:500 14px/1.4 var(--f-body);color:var(--ink-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;max-width:980px}
.card{position:relative;display:block;width:100%;padding:0;border:0;border-radius:22px;overflow:hidden;cursor:pointer;
  aspect-ratio:16/9;max-width:100%;background:#0E1626;box-shadow:0 14px 34px rgba(30,45,80,.18);
  transition:transform .25s ease,box-shadow .25s ease;-webkit-tap-highlight-color:transparent}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.card:active{transform:scale(.97)}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(30,45,80,.24)}}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.card .tag{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;
  font:600 12px var(--f-body);letter-spacing:.06em;color:#fff;background:rgba(8,14,28,.55);
  border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 12px 7px 14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card .tag svg{flex:none}

/* ---------- ОТКРЫТОЕ ПРИЛОЖЕНИЕ ---------- */
.viewer{position:fixed;inset:0;z-index:30;box-sizing:border-box;background:#0E1626;
  transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.viewer.on{transform:none;visibility:visible}
.viewer.pad{padding-top:var(--top-inset)}
.viewer iframe{display:block;width:100%;height:100%;border:0;background:#0E1626}
.viewer .spin{position:absolute;top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;
  border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}
.viewer.loaded .spin{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.back{position:fixed;z-index:31;top:calc(var(--top-inset) + 12px);left:max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:6px;font:600 13px var(--f-body);color:var(--ink);
  background:#fff;border:0;border-radius:999px;padding:8px 14px 8px 10px;cursor:pointer}
.back:focus-visible{outline:2px solid #fff;outline-offset:2px}

body.inapp .feed{overflow:hidden}
@media (prefers-reduced-motion:reduce){.viewer{transition:none}.hint svg{animation:none}.overlay{transition:none}}
</style>
</head>
<body>
<main class="feed" id="feed">
  <section class="screen hero" id="hero" aria-label="Kozak Studio — Web App Development">
    <h1 class="sr">KOZAK STUDIO — Web App Development</h1>
    <video id="intro" src="intro.mp4" poster="start.jpg" muted playsinline preload="auto"></video>
    <button class="skip" id="skip" type="button" data-i18n="skip">Пропустить</button>
    <button class="tap" id="tap" type="button" data-i18n="tap">Нажмите, чтобы начать</button>
    <div class="overlay">
      <button class="hint" id="hint" type="button" aria-label="Перейти к демо" data-i18n-aria="toDemos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
        <span data-i18n="swipe">Смахните вверх</span>
      </button>
    </div>
  </section>

  <section class="screen works" id="works" aria-label="Проекты" data-i18n-aria="projects">
    <div class="works-head">
      <div class="head-row">
        <h2 data-i18n="title">Наши проекты</h2>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button>
        </div>
      </div>
      <p data-i18n="sub">Нажмите на обложку, чтобы открыть приложение</p>
    </div>
    <div class="cards">
        <button class="card" type="button" data-src="https://travelkozko.github.io/pogruzhenie/" aria-label="Открыть Погружение" data-i18n-aria="open_pogruzhenie">
          <img src="covers/pogruzhenie.jpg" alt="" width="1024" height="576" loading="lazy" decoding="async">
          <span class="tag"><span data-i18n="tag_pogruzhenie">Погружение · дайв-центр</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
        <button class="card" type="button" data-src="https://travelkozko.github.io/viet-ride/" aria-label="Открыть Viet Ride" data-i18n-aria="open_viet-ride">
          <img src="covers/viet-ride.jpg" alt="" width="1024" height="576" loading="lazy" decoding="async">
          <span class="tag"><span data-i18n="tag_viet-ride">Viet Ride · аренда байков</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
        <button class="card" type="button" data-src="https://travelkozko.github.io/step-loud/" aria-label="Открыть Step Loud" data-i18n-aria="open_step-loud">
          <img id="coverSL" src="covers/step-loud.jpg" alt="" width="1024" height="576" loading="lazy" decoding="async">
          <span class="tag"><span data-i18n="tag_step-loud">Step Loud · магазин кроссовок</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
    </div>
  </section>
</main>
<div class="viewer" id="viewer" aria-hidden="true"><span class="spin"></span></div>
<button class="back" id="back" type="button" hidden>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  <span data-i18n="back">Назад</span>
</button>

<script>
try{const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes();}catch(e){}
  try{if(/android|ios/.test(tg.platform)&&tg.requestFullscreen&&!tg.isFullscreen)tg.requestFullscreen();}catch(e){}}}catch(e){}
const feed=document.getElementById('feed'),hero=document.getElementById('hero'),v=document.getElementById('intro');
const finish=()=>{ // заставка замирает на последнем кадре и больше не повторяется
  if(hero.classList.contains('done'))return;
  try{ if(v.duration) v.currentTime=v.duration-0.05; v.pause(); }catch(e){}
  hero.classList.add('done');
};
v.addEventListener('ended',finish);
v.addEventListener('error',finish);
// видео стартует только когда полностью загрузилось; если автозапуск запрещён — ждём касания
const waitTap=()=>{ if(!hero.classList.contains('done')&&!hero.classList.contains('playing')) hero.classList.add('wait'); };
const start=()=>{
  if(hero.classList.contains('playing')||hero.classList.contains('done'))return;
  hero.classList.remove('wait');
  v.play().then(()=>hero.classList.add('playing')).catch(waitTap);
};
if(matchMedia('(prefers-reduced-motion: reduce)').matches){v.poster='end.jpg';finish();}
else{
  if(v.readyState>=4) start(); else v.addEventListener('canplaythrough',start,{once:true});
  setTimeout(waitTap,3500); // некоторые телефоны не грузят видео без касания
}

const next=()=>feed.scrollTo({top:feed.clientHeight,behavior:'smooth'});
document.getElementById('skip').addEventListener('click',e=>{e.stopPropagation();finish();});
document.getElementById('hint').addEventListener('click',e=>{e.stopPropagation();next();});
document.getElementById('tap').addEventListener('click',e=>{e.stopPropagation();start();});
hero.addEventListener('click',()=>{
  if(hero.classList.contains('done')) return next();
  if(!hero.classList.contains('playing')) return start();
});
// ---------- язык: по языку телефона, с ручным переключателем RU / EN ----------
const I18N={
  ru:{skip:'Пропустить',tap:'Нажмите, чтобы начать',swipe:'Смахните вверх',toDemos:'Перейти к демо',projects:'Проекты',
      title:'Наши проекты',sub:'Нажмите на обложку, чтобы открыть приложение',back:'Назад',app:'Демо-приложение',
      tag_pogruzhenie:'Погружение · дайв-центр','tag_viet-ride':'Viet Ride · аренда байков','tag_step-loud':'Step Loud · магазин кроссовок',
      open_pogruzhenie:'Открыть Погружение','open_viet-ride':'Открыть Viet Ride','open_step-loud':'Открыть Step Loud'},
  en:{skip:'Skip',tap:'Tap to start',swipe:'Swipe up',toDemos:'Go to demos',projects:'Projects',
      title:'Our projects',sub:'Tap a cover to open the app',back:'Back',app:'Demo app',
      tag_pogruzhenie:'Deep Dive · dive center','tag_viet-ride':'Viet Ride · bike rental','tag_step-loud':'Step Loud · sneaker store',
      open_pogruzhenie:'Open Deep Dive','open_viet-ride':'Open Viet Ride','open_step-loud':'Open Step Loud'}
};
const pickLang=()=>{
  try{const q=new URLSearchParams(location.search).get('lang');if(q==='ru'||q==='en')return q;}catch(e){}
  try{const s=localStorage.getItem('lang');if(s==='ru'||s==='en')return s;}catch(e){}
  return /^(ru|uk|be|kk)\b/i.test(navigator.language||'')?'ru':'en';
};
let LANG=pickLang();
const setLang=l=>{
  LANG=l;const T=I18N[l];document.documentElement.lang=l;
  document.querySelectorAll('[data-i18n]').forEach(e=>{const t=T[e.dataset.i18n];if(t)e.textContent=t;});
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>{const t=T[e.dataset.i18nAria];if(t)e.setAttribute('aria-label',t);});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  const c=document.getElementById('coverSL');if(c)c.src=l==='en'?'covers/step-loud-en.jpg':'covers/step-loud.jpg';
};
setLang(LANG);
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',e=>{
  e.stopPropagation();if(b.dataset.lang===LANG)return;setLang(b.dataset.lang);
  try{localStorage.setItem('lang',LANG);}catch(err){}
  try{window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback&&Telegram.WebApp.HapticFeedback.selectionChanged();}catch(err){}
}));
const withLang=src=>src+(src.includes('?')?'&':'?')+'lang='+LANG;

// обложки → приложение открывается поверх витрины; возврат — «Назад» в Telegram
const tg=window.Telegram&&window.Telegram.WebApp;
const inTG=!!(tg&&tg.initData);
const viewer=document.getElementById('viewer'),back=document.getElementById('back');
const frames={};let open=null;
const haptic=t=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t);}catch(e){}};
const openApp=src=>{
  Object.values(frames).forEach(f=>f.hidden=true);
  let f=frames[src];
  if(!f){f=document.createElement('iframe');f.title=I18N[LANG].app;f.allow='autoplay; fullscreen';
    viewer.classList.remove('loaded');f.addEventListener('load',()=>{viewer.classList.add('loaded');forward(f);setTimeout(()=>forward(f),300);setTimeout(()=>forward(f),1200);},{once:true});
    f.src=src;viewer.appendChild(f);frames[src]=f;}
  else{viewer.classList.add('loaded');forward(f);}
  f.hidden=false;open=src;viewer.classList.add('on');viewer.setAttribute('aria-hidden','false');
  document.body.classList.add('inapp');back.hidden=inTG;haptic('medium');
  try{tg&&tg.BackButton&&tg.BackButton.show();}catch(e){}
};
const closeApp=()=>{
  if(!open)return;open=null;viewer.classList.remove('on');viewer.setAttribute('aria-hidden','true');
  document.body.classList.remove('inapp');back.hidden=true;haptic('light');
  try{tg&&tg.BackButton&&tg.BackButton.hide();}catch(e){}
};
// приложению внутри витрины передаём те же отступы, что Telegram даёт ему при прямом открытии
const forward=f=>{try{const W=f.contentWindow.Telegram&&f.contentWindow.Telegram.WebView;if(!W||!tg)return;
  W.receiveEvent('safe_area_changed',tg.safeAreaInset||{top:0,bottom:0,left:0,right:0});
  W.receiveEvent('content_safe_area_changed',tg.contentSafeAreaInset||{top:0,bottom:0,left:0,right:0});
  if(tg.isFullscreen)W.receiveEvent('fullscreen_changed',{is_fullscreen:true});
  if(tg.viewportHeight)W.receiveEvent('viewport_changed',{height:tg.viewportHeight,is_expanded:true,is_state_stable:true});
}catch(e){}};
const forwardAll=()=>Object.values(frames).forEach(forward);
try{tg&&['safeAreaChanged','contentSafeAreaChanged','fullscreenChanged','viewportChanged'].forEach(e=>tg.onEvent(e,forwardAll));}catch(e){}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{viewer.classList.toggle('pad',c.dataset.pad==='1');openApp(withLang(c.dataset.src));}));
back.addEventListener('click',closeApp);
try{tg&&tg.BackButton&&tg.BackButton.onClick(closeApp);}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeApp();});
// в Telegram — лёгкая вибрация при смене экрана
let last=0;feed.addEventListener('scroll',()=>{const i=Math.round(feed.scrollTop/feed.clientHeight);
  if(i!==last){last=i;try{window.Telegram?.WebApp?.HapticFeedback?.selectionChanged();}catch(e){}}},{passive:true});
</script>
</body>
</html>
